<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" fill="none" role="img" aria-label="Workspace concept: folder, workspace, chat">
  <style>
    .node-bg  { fill: #1f2937; stroke: #475569; }
    .accent   { stroke: #84cc16; fill: #84cc16; }
    .arrow    { stroke: #64748b; fill: none; }
    .text     { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; }
    @media (prefers-color-scheme: light) {
      .node-bg { fill: #f1f5f9; stroke: #cbd5e1; }
      .text { fill: #334155; }
    }
  </style>

  <!-- node 1: folder -->
  <g transform="translate(60 30)">
    <rect class="node-bg" width="72" height="60" rx="14" stroke-width="2" />
    <g transform="translate(22 16)" class="accent" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M0 6 V22 Q0 26 4 26 H24 Q28 26 28 22 V10 Q28 6 24 6 H14 L10 2 H4 Q0 2 0 6Z" />
    </g>
    <text x="36" y="106" text-anchor="middle" class="text" font-size="12">My folder</text>
  </g>

  <!-- arrow -->
  <path d="M148 60 H188" class="arrow" stroke-width="2" stroke-linecap="round" />
  <path d="M180 54 L188 60 L180 66" class="arrow" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- node 2: workspace -->
  <g transform="translate(208 30)">
    <rect class="node-bg" width="72" height="60" rx="14" stroke-width="2" />
    <g transform="translate(22 18)" class="accent" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14 0 L0 8 L14 16 L28 8 Z" />
      <path d="M0 16 L14 24" />
      <path d="M28 16 L14 24" />
    </g>
    <text x="36" y="106" text-anchor="middle" class="text" font-size="12">Workspace</text>
  </g>

  <!-- arrow -->
  <path d="M296 60 H336" class="arrow" stroke-width="2" stroke-linecap="round" />
  <path d="M328 54 L336 60 L328 66" class="arrow" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- node 3: chat -->
  <g transform="translate(356 30)">
    <rect class="node-bg" width="72" height="60" rx="14" stroke-width="2" />
    <g transform="translate(22 18)" class="accent" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 4 Q0 0 4 0 H24 Q28 0 28 4 V16 Q28 20 24 20 H10 L4 26 V20 Q0 20 0 16 Z" />
    </g>
    <text x="36" y="106" text-anchor="middle" class="text" font-size="12">Ask anything</text>
  </g>
</svg>
