<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="680" height="130" fill="none" role="img" aria-label="Agent flow: goal, plan, run, answer">
  <style>
    .node-bg  { fill: #1f2937; stroke: #475569; }
    .accent   { stroke: #84cc16; fill: #84cc16; }
    .arrow    { stroke: #64748b; fill: none; }
    .text     { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; }
    @media (prefers-color-scheme: light) {
      .node-bg { fill: #f1f5f9; stroke: #cbd5e1; }
      .text { fill: #334155; }
    }
  </style>

  <!-- 1. goal (sparkles) -->
  <g transform="translate(40 30)">
    <rect class="node-bg" width="72" height="60" rx="14" stroke-width="2" />
    <g transform="translate(22 18)" class="accent" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14 0 L17 10 L27 13 L17 16 L14 26 L11 16 L1 13 L11 10 Z" />
      <circle cx="3" cy="3" r="1.4" />
      <circle cx="24" cy="22" r="1.4" />
    </g>
    <text x="36" y="106" text-anchor="middle" class="text" font-size="12">Goal</text>
  </g>

  <path d="M128 60 H168" class="arrow" stroke-width="2" stroke-linecap="round" />
  <path d="M160 54 L168 60 L160 66" class="arrow" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 2. plan (list-checks) -->
  <g transform="translate(188 30)">
    <rect class="node-bg" width="72" height="60" rx="14" stroke-width="2" />
    <g transform="translate(22 16)" class="accent" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 2 L4 6 L10 0" />
      <path d="M0 14 L4 18 L10 12" />
      <path d="M0 26 L4 30 L10 24" />
      <line x1="14" y1="2" x2="28" y2="2" />
      <line x1="14" y1="14" x2="28" y2="14" />
      <line x1="14" y1="26" x2="28" y2="26" />
    </g>
    <text x="36" y="106" text-anchor="middle" class="text" font-size="12">Plan</text>
  </g>

  <path d="M276 60 H316" class="arrow" stroke-width="2" stroke-linecap="round" />
  <path d="M308 54 L316 60 L308 66" class="arrow" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 3. run tools (bot) -->
  <g transform="translate(336 30)">
    <rect class="node-bg" width="72" height="60" rx="14" stroke-width="2" />
    <g transform="translate(22 18)" class="accent" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="6" width="24" height="18" rx="3" />
      <line x1="14" y1="2" x2="14" y2="6" />
      <circle cx="9" cy="14" r="1.4" />
      <circle cx="19" cy="14" r="1.4" />
    </g>
    <text x="36" y="106" text-anchor="middle" class="text" font-size="12">Run tools</text>
  </g>

  <path d="M424 60 H464" class="arrow" stroke-width="2" stroke-linecap="round" />
  <path d="M456 54 L464 60 L456 66" class="arrow" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4. answer (file with check) -->
  <g transform="translate(484 30)">
    <rect class="node-bg" width="72" height="60" rx="14" stroke-width="2" />
    <g transform="translate(20 16)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 H22 L30 8 V28 H0 Z" class="accent" stroke-width="2.4" />
      <circle cx="22" cy="22" r="6" class="accent" fill="#84cc16" />
      <path d="M19 22 L21 24 L26 19" stroke="#0a0f1c" stroke-width="2" />
    </g>
    <text x="36" y="106" text-anchor="middle" class="text" font-size="12">Answer</text>
  </g>
</svg>
