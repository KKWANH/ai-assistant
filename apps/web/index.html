<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ariadne</title>
    <meta
      name="description"
      content="Ariadne — a local-first AI workspace for traceable, repeatable work."
    />
    <meta name="theme-color" content="#0e0e10" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social preview -->
    <meta property="og:title" content="Ariadne" />
    <meta
      property="og:description"
      content="A local-first AI workspace for traceable, repeatable work."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Fonts are SELF-HOSTED (Pretendard via src/main.tsx import — bundled by
         Vite, served from this origin). No CDN font links: the app is
         local-first and must render Korean identically offline / in the
         desktop shell. Pretendard's Latin is Inter-derived, so it covers
         English too; code falls back to the system mono stack. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
