<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Ariadne — a spun web (minimal corner web): radial spokes from an anchor
       corner + a connecting thread. Favicon = a flat solid tile (reads cleanly
       at 16px). -->
  <rect width="32" height="32" rx="7" fill="#6366f1"/>
  <g fill="none" stroke="#fafafa" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- four radial spokes from the anchor corner -->
    <path d="M7 25 7 7 M7 25 16 9 M7 25 24 17 M7 25 25 25"/>
    <!-- one connecting thread -->
    <path d="M7 13 14 14.5 20.5 19 23 25"/>
  </g>
</svg>
