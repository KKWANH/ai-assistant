# Generation cases — retrieve → generate → score.
#
# `requiredContext` is the set of paths the retrieved chunks must cover;
# absent files lower context recall but don't hard-fail.
# `expectedClaims` are substrings (case-insensitive) the answer SHOULD contain.
# `forbiddenClaims` are substrings the answer MUST NOT contain.
# `expectedAbstention: true` means the correct response is "I don't know" /
# "the context doesn't say" — the generator is deliberately given no
# useful context.

cases:
  - id: gen-tsla-quantity-001
    workspace: portfolio-small
    query: "What's my TSLA quantity?"
    requiredContext: ["holdings.csv"]
    expectedClaims: ["12"]
    forbiddenClaims: ["I don't have access", "no information"]
    expectedAbstention: false

  - id: gen-fx-rate-001
    workspace: portfolio-small
    query: "What's the USD to KRW exchange rate?"
    requiredContext: ["fx-rates.csv"]
    expectedClaims: ["1380"]
    forbiddenClaims: ["unknown", "no rate"]
    expectedAbstention: false

  - id: gen-portfolio-largest-001
    workspace: portfolio-small
    query: "What's my largest USD position by share count?"
    requiredContext: ["notes.md", "holdings.csv"]
    expectedClaims: ["TSLA"]
    forbiddenClaims: []
    expectedAbstention: false

  - id: gen-symbol-boost-001
    workspace: code-small
    query: "What constant controls the symbol boost amount?"
    requiredContext: ["src/retrieval.ts"]
    expectedClaims: ["SYMBOL_BOOST"]
    forbiddenClaims: []
    expectedAbstention: false

  - id: gen-korean-realism-001
    workspace: korean-mixed
    query: "조형예술론에서 사실성을 어떻게 설명하나?"
    requiredContext: ["조형예술론.md"]
    expectedClaims: ["사실성"]
    forbiddenClaims: []
    expectedAbstention: false

  - id: gen-korean-schedule-001
    workspace: korean-mixed
    query: "월요일 강의는 뭐가 있나?"
    requiredContext: ["강의계획.md"]
    expectedClaims: ["조형예술론"]
    forbiddenClaims: []
    expectedAbstention: false

  - id: gen-abstain-001
    # Question that no fixture file answers — abstention check.
    workspace: portfolio-small
    query: "What was the closing price of Bitcoin on March 17, 1998?"
    requiredContext: []
    expectedClaims: []
    forbiddenClaims: ["$"]
    expectedAbstention: true

  - id: gen-abstain-002
    workspace: code-small
    query: "What's the company's quarterly revenue target?"
    requiredContext: []
    expectedClaims: []
    forbiddenClaims: ["$", "billion", "million"]
    expectedAbstention: true

  # ── AJ — INTELLIGENCE_TUNING.md §1 metrics ──────────────────────────────
  # These three guard the AI4 prompt changes against silent regression
  # in a future prompt rewrite.

  # Citation requirement — when sources are present, the answer must
  # carry at least one [1]-style marker. INTELLIGENCE_TUNING §1.2.
  - id: gen-citation-required-001
    workspace: portfolio-small
    query: "What's my TSLA quantity according to the holdings file?"
    requiredContext: ["holdings.csv"]
    expectedClaims: ["12", "[1]"]
    forbiddenClaims: []
    expectedAbstention: false

  # Gap acknowledgement — when the supplied context can't answer part of
  # the question, the answer must say so. INTELLIGENCE_TUNING §1.3.
  - id: gen-gap-acknowledge-001
    workspace: portfolio-small
    query: "What's my TSLA quantity and what's the company's CEO compensation last year?"
    requiredContext: ["holdings.csv"]
    expectedClaims: ["12"]
    forbiddenClaims: []
    # The answer must contain a phrase signalling the second part is
    # not covered. Either the explicit phrasing we asked the prompt to
    # use, or a generic 'context doesn't include' / 'no information'
    # is acceptable.
    expectedGapAck: true
    gapAckPhrases:
      - "doesn't include"
      - "don't see anything"
      - "from general knowledge"
      - "context doesn't"
      - "not in the supplied"
    expectedAbstention: false

  # Anti-padding — first sentence should answer the question (no
  # 'Great question!' / 'Sure! Here is…' intros). INTELLIGENCE_TUNING §1.4.
  # The metric: the first 100 chars must contain at least one substring
  # from expectedClaims. Padding answers fail because they front-load
  # filler.
  - id: gen-no-padding-001
    workspace: portfolio-small
    query: "What's the USD to KRW exchange rate?"
    requiredContext: ["fx-rates.csv"]
    expectedClaims: ["1380"]
    forbiddenClaims: []
    leadWithAnswer: true
    forbidLeadPhrases:
      - "Great question"
      - "Sure!"
      - "I'd be happy to help"
      - "Let me explain"
    expectedAbstention: false
