[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiws"
version = "0.1.0"
description = "Local-first AI workspace for project/session conversations and reusable skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiws = "aiws.cli:main"
aiws-cloudflare = "aiws.cloudflare:main"

[tool.setuptools.packages.find]
where = ["src"]
