[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiws"
version = "0.1.0"
description = "Local-first AI workspace for project/session conversations and reusable skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "olefile>=0.47",
    "Pillow>=10.0",
    "pypdf>=5.1",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3",
    "watchdog>=4.0",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
aiws = "aiws.cli:main"
aiws-cloudflare = "aiws.cloudflare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B017"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "web", ".venv"]
skips = ["B101", "B104", "B105", "B310", "B314", "B404", "B405", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
