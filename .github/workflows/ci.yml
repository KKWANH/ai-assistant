name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — no value in finishing
# a stale build when a new commit is already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        # ci is strict-lockfile + skips lifecycle scripts we don't need.
        # If/when a package-lock.json conflict appears, swap to `npm install`
        # behind a clear PR description; don't auto-fix in CI.
        run: npm ci

      - name: Typecheck (all packages)
        run: npm run typecheck

      - name: Unit tests (security invariants)
        # Hard gate: node:test suite for the path-guard, local/remote access
        # split and secret-stripping invariants. Fails the build on regression.
        run: npm test

      - name: Retrieval eval (informational — soft gate, does NOT fail the build)
        # eval:retrieval:ci runs against the in-repo fixtures with no AI keys
        # (keyword-only path), which scores below the embedding-tuned thresholds
        # in apps/server/src/eval/gates.yaml — so these are intentionally SOFT
        # gates and the step exits 0 regardless. It prints the metrics for trend
        # tracking; it does NOT gate. (Run with --strict locally to hard-fail.)
        run: npm run eval:retrieval:ci

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck-and-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:web

      - name: Bundle budget gate (PERFORMANCE_ARCHITECTURE §1)
        # Reads apps/web/dist/assets/*.js, gzips each, checks against
        # the categorised budgets in scripts/check-bundle-budgets.ts.
        # Fails the build on budget violations or surprise unbudgeted
        # chunks (>50kB gz without an explicit rule). The chunk report
        # is printed to the job log either way for trend tracking.
        run: npm run check:bundle

      # Upload as an artifact so a reviewer on a PR can grab the bundle
      # without needing a local environment. Cheap; expires in 7 days.
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle-${{ github.sha }}
          path: apps/web/dist
          retention-days: 7
