name: Investment Rebalancer
description: ISA, IRP, DC, and taxable portfolio rebalancing workspace.
root: .

permissions:
  file_read: true
  file_write: confirm
  shell: confirm
  network: false

context:
  include:
    - files/*.csv
    - files/*.yaml
    - files/*.md
  exclude:
    - .env
    - secrets/*
    - private/*
    - credentials/*

panels:
  - files
  - memory
  - commands
  - runs
  - artifacts

commands:
  summarize_portfolio:
    kind: prompt_recipe
    status: partial
    output: chat_prompt
    label: 현재 포트폴리오 요약
    description: 보유 종목, 계좌별 비중, 목표 비중을 요약한다.
    prompt: |
      files/portfolio.example.csv와 files/target_allocation.example.yaml을 읽고
      현재 포트폴리오를 계좌별, 자산군별로 요약해줘.

  rebalance_plan:
    kind: python
    status: ready
    output: artifact
    label: 리밸런싱 계산
    description: 현재 비중과 목표 비중 차이를 계산해 CSV 리포트를 만든다.
    cwd: .
    script: scripts/calculate_rebalance.py
    args:
      - files/portfolio.example.csv
      - files/target_allocation.example.yaml
      - artifacts/rebalance-table.csv
    output:
      - artifacts/rebalance-table.csv

  risk_check:
    kind: prompt_recipe
    status: partial
    output: chat_prompt
    label: 과집중 리스크 점검
    description: 종목, 자산군, 계좌별 쏠림 위험을 점검한다.
    prompt: |
      현재 포트폴리오에서 종목, 자산군, 계좌별 과집중 리스크를 점검해줘.
      투자 조언처럼 단정하지 말고 리스크와 선택지를 분리해서 제시해줘.

  export_report:
    kind: shell
    status: partial
    output: artifact
    label: 리밸런싱 리포트 생성
    description: 계산 결과와 전략 메모를 Markdown 리포트로 묶는다.
    cwd: .
    command: ./scripts/export_report.sh
    output:
      - artifacts/rebalance-report.md
