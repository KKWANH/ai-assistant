version: 1
name: CSV Analysis
description: Deterministic table analysis workspace.
root: .

context:
  include:
    - data/**/*.csv
  exclude:
    - .env
    - secrets/**
    - keys/**

commands:
  profile_table:
    kind: prompt_recipe
    label: Profile table
    description: Summarize deterministic CSV/XLSX profiling artifacts.
    prompt: |
      Use computed table profile artifacts only.
      Do not invent column meanings that are not supported by the profile.
    outputs:
      - artifacts/csv-summary.md
